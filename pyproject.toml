[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oslo-oil-sensitivity"
version = "0.1.0"
description = "How sensitive is each Oslo Børs stock and sector to the oil price? Rolling two-factor betas with HAC confidence bands, a rule-based event study, scenario tables and an out-of-sample check."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oscar Schjelderup" }]
keywords = ["oil beta", "oslo børs", "factor model", "event study", "newey-west", "yfinance"]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "yfinance>=0.2.50",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oilbeta = "oilbeta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oilbeta = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E731",   # small lambdas as local helpers are fine
  "E501",   # line length is a formatting matter, not something CI should fail on
  "B905",   # zip() over axes/labels built from the same list two lines earlier
]
